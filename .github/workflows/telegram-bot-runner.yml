name: 24/7 Autonomous X Premium Gift Bot

on:
  workflow_dispatch:
  schedule:
    # Auto re-trigger every 5 hours
    - cron: '0 */5 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: x-gift-bot-singleton
  cancel-in-progress: true

jobs:
  run-bot:
    name: ⚡ 24/7 X Gift Telegram Bot Worker
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run 24/7 X Gift Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID || '7080909965' }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
          TG_PROXY: ${{ secrets.TG_PROXY || '' }}
        run: |
          echo "============================================================"
          echo "🚀 STARTING 24/7 X GIFT TELEGRAM BOT WORKER"
          echo "Cloud: High-Speed Azure Cloud Datacenter (US/EU)"
          echo "============================================================"
          # Run python bot for 4 hours 55 minutes (17700s)
          timeout 17700s python telegram_bot.py || true

      - name: ⚡ Zero-Downtime Auto-Retrigger
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "============================================================"
          echo "🔄 TRIGGERING NEXT RUNNER FOR ZERO-DOWNTIME CONTINUITY..."
          echo "============================================================"
          gh workflow run telegram-bot-runner.yml -R ${{ github.repository }} || true
